<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestar em Movimento - YouTube Banner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f5f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .banner-container {
            width: 100%;
            max-width: 2560px;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #FFF5F0 0%, #F0E6FF 50%, #FFE6F0 100%);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-radius: 12px;
        }

        /* Elementos decorativos - formas abstratas */
        .decoration {
            position: absolute;
            opacity: 0.15;
            pointer-events: none;
        }

        .circle-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #FF6B9D, #C44569);
            border-radius: 50%;
            top: -150px;
            right: -100px;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #8B5CF6, #5B21B6);
            border-radius: 50%;
            bottom: -100px;
            left: -50px;
        }

        .circle-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #EC4899, #BE185D);
            border-radius: 50%;
            bottom: 0;
            right: 10%;
        }

        /* Imagem principal (placeholder) */
        .main-image {
            position: absolute;
            right: 5%;
            bottom: 0;
            width: 40%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            z-index: 2;
        }

        .pregnant-woman {
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(255, 107, 157, 0.3), transparent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 200px;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.1));
        }

        /* Conteúdo de texto */
        .content {
            position: absolute;
            left: 5%;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            max-width: 50%;
        }

        .tagline {
            font-size: 16px;
            color: #FF6B9D;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .title {
            font-size: 72px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF6B9D, #8B5CF6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.1;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .subtitle {
            font-size: 20px;
            color: #666;
            font-weight: 500;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .features {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            backdrop-filter: blur(10px);
        }

        .feature-icon {
            font-size: 18px;
        }

        /* Safe area marker (para referência) */
        .safe-area {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 1235px;
            height: 338px;
            border: 2px dashed rgba(255, 107, 157, 0.3);
            pointer-events: none;
            z-index: 1;
        }

        /* Responsivo */
        @media (max-width: 1400px) {
            .title {
                font-size: 48px;
            }
            .subtitle {
                font-size: 16px;
            }
            .content {
                max-width: 60%;
            }
            .main-image {
                width: 35%;
            }
        }

        @media (max-width: 768px) {
            .banner-container {
                aspect-ratio: auto;
                height: 300px;
            }
            .title {
                font-size: 32px;
            }
            .subtitle {
                font-size: 14px;
            }
            .features {
                gap: 10px;
            }
            .feature {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="banner-container">
        <!-- Elementos decorativos -->
        <div class="decoration circle-1"></div>
        <div class="decoration circle-2"></div>
        <div class="decoration circle-3"></div>

        <!-- Safe area reference -->
        <div class="safe-area"></div>

        <!-- Conteúdo principal -->
        <div class="content">
            <div class="tagline">✨ Seu acompanhamento gestacional</div>
            <h1 class="title">Gestar em Movimento</h1>
            <p class="subtitle">
                Exercícios personalizados, comunidade de apoio e orientações de especialistas para cada semana da sua gravidez.
            </p>
            <div class="features">
                <div class="feature">
                    <span class="feature-icon">🎯</span>
                    <span>Exercícios adaptados</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">👥</span>
                    <span>Comunidade</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">📱</span>
                    <span>Gratuito</span>
                </div>
                <div class="feature">
                    <span class="feature-icon">💚</span>
                    <span>Especialistas</span>
                </div>
            </div>
        </div>

        <!-- Imagem da gestante (placeholder) -->
        <div class="main-image">
            <div class="pregnant-woman">🤰</div>
        </div>
    </div>
</body>
</html>
